name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    name: Dashboard (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - run: google-chrome --version
      - run: python tests/dashboard/run_browser_tests.py

  envelopes:
    name: Envelope script (synthetic tracks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("dplyr")'
      - run: Rscript tests/envelopes/test_envelopes.R
